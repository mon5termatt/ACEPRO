# ZeroG Mercury One.1 printer configuration
# Mercury One.1 is a CoreXY conversion for Ender 5 / Ender 5 Pro / Ender 5 Plus.
# Build sizes: mercury_235 (Ender 5/Pro, ~235x235) or mercury_370 (Ender 5 Plus, ~370x370).
# Requires: printer_generic_macros.cfg, ace_merc.cfg (ACE Pro).
# See docs/Config_Reference.md for parameters.
#
# NOTE: ZeroG does not provide an official Klipper config. Pin assignments and
# serial paths below are templates — set [mcu] serial, nozzle_mcu, and pins
# for your mainboard and EVA 2.4 (or other) toolhead.
[include mainsail.cfg]
[include printer_generic_macros.cfg]

######### Filament runout (nozzle) — used by ACE and pause/resume #########
[filament_switch_sensor filament_runout_nozzle]
pause_on_runout: True
runout_gcode:
    {% set ps = printer.print_stats.state|string %}
    {% if ps in ["printing", "paused"] %}
        TO_THROW_POSITION
        RESPOND TYPE=command MSG="action:prompt_begin Filament Runout"
        RESPOND TYPE=command MSG="action:prompt_text Filament runout detected. Print is paused. Insert filament into the toolhead, it will be pulled in automatically."
        RESPOND TYPE=command MSG="action:prompt_button Cancel Print|RUNOUT_CANCEL_PRINT"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        { action_respond_info("MERC: Runout ignored (state=%s)" % ps) }
    {% endif %}
insert_gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    {% set ps = printer.print_stats.state|string %}
    {% if ps == "paused" %}
        M83
        G92 E0
        G1 E150 F300
        G92 E0
        FLUSH_POOP
        RESPOND TYPE=command MSG="action:prompt_begin Filament Loaded"
        RESPOND TYPE=command MSG="action:prompt_text Filament detected. Choose next action:"
        RESPOND TYPE=command MSG="action:prompt_button Extrude 50mm|INSERT_EXTRUDE_50"
        RESPOND TYPE=command MSG="action:prompt_button Resume Print|INSERT_RESUME_PRINT"
        RESPOND TYPE=command MSG="action:prompt_button Cancel Print|INSERT_CANCEL_PRINT"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% elif ps not in ["printing", "paused"] %}
        RESPOND TYPE=command MSG="action:prompt_begin Filament Detected"
        RESPOND TYPE=command MSG="action:prompt_text Filament detected while printer is idle. Load filament to nozzle?"
        RESPOND TYPE=command MSG="action:prompt_button Load Filament (@245°C)|INSERT_LOAD_FILAMENT"
        RESPOND TYPE=command MSG="action:prompt_button Dismiss|INSERT_DISMISS"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}
event_delay: 3.0
pause_delay: 0.5
# Set switch_pin to your toolhead filament sensor pin (e.g. nozzle_mcu:PB0 for EVA 2.4)
switch_pin: nozzle_mcu:PB0

# Optional: RDM (return detection module) if fitted — uncomment and set pin for ACE
# [filament_switch_sensor filament_runout_rdm]
# pause_on_runout: False
# switch_pin: nozzle_mcu:PB1

[include ace_merc.cfg]

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 117.5   ; center X for 235mm; use 185 for 370mm
variable_custom_park_y    : 117.5   ; center Y for 235mm; use 185 for 370mm
variable_park_at_cancel   : True
variable_park_at_cancel_x : 117.5
variable_park_at_cancel_y : 117.5
gcode:

#######################
# MCU — set serial paths for your mainboard and toolhead (e.g. CAN, USB)
#######################
[virtual_sdcard]
path: ~/printer_data/gcodes

[mcu]
serial: /dev/ttyGS0
restart_method: command
baud: 576000

[mcu nozzle_mcu]
serial: /dev/ttyGS1
restart_method: command
baud: 576000

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
square_corner_velocity: 5.0
max_z_velocity: 15
max_z_accel: 500
# mercury_235: ~235x235x300 ; mercury_370: ~370x370x400

# CoreXY steppers — set pins for your mainboard (Ender 5 Plus/Pro typical)
[stepper_x]
step_pin: PB12
dir_pin: PA7
enable_pin: !PC3
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50
homing_retract_dist: 0
second_homing_speed: 5
endstop_pin: tmc2209_stepper_x:virtual_endstop

[stepper_y]
step_pin: PA5
dir_pin: PA4
enable_pin: !PC3
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 40
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50
homing_retract_dist: 0
second_homing_speed: 5
endstop_pin: tmc2209_stepper_y:virtual_endstop

# Z — set pins and position_max for your frame (Ender 5 Pro ~300, Ender 5 Plus ~400)
[stepper_z]
step_pin: PB14
dir_pin: PB13
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_min: -4
position_max: 300
homing_speed: 6
homing_retract_dist: 4
second_homing_speed: 3

# Probe — adjust pin and offsets for your EVA 2.4 / probe
[probe_ks1]
pin: nozzle_mcu:PB15
x_offset: 0
y_offset: 0
z_offset: 0
speed: 3.0
lift_speed: 12.0
samples: 3
sample_retract_dist: 3
samples_result: median
samples_tolerance: 0.04
samples_tolerance_retries: 20

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 225, 225
probe_count: 5, 5
mesh_pps: 2, 2
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

# Extruder — EVA 2.4 typical pins; set sensor_type and rotation_distance for your hotend
[extruder]
max_extrude_only_distance: 1200.0
step_pin: nozzle_mcu:PA12
dir_pin: !nozzle_mcu:PA11
enable_pin: !nozzle_mcu:PC13
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 6.5756
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 50
heater_pin: nozzle_mcu:PB8
sensor_type: NTC 100K beta 3950
sensor_pin: nozzle_mcu:PA0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
min_extrude_temp: 170
max_temp: 320
pressure_advance: 0.03

[heater_bed]
heater_pin: PA0
sensor_type: NTC 100K beta 3950
sensor_pin: PC0
control: pid
min_temp: -200
max_temp: 140

[tmc2209 stepper_x]
uart_pin: PA3
uart_address: 3
run_current: 1.2
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: True
driver_SGTHRS: 75
diag_pin: PA8

[tmc2209 stepper_y]
uart_pin: PA3
uart_address: 1
run_current: 1.2
hold_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: True
driver_SGTHRS: 75
diag_pin: PA11

[tmc2209 stepper_z]
uart_pin: PA3
uart_address: 2
run_current: 1.0
hold_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
interpolate: True

[tmc2209 extruder]
uart_pin: nozzle_mcu:PA3
uart_address: 3
run_current: 0.6
hold_current: 0.3
sense_resistor: 0.110
stealthchop_threshold: 99999
interpolate: True

[idle_timeout]
timeout: 3600
gcode:
    {% if printer.pause_resume.is_paused %}
        M118 Bypassed Timeout
        M117 Bypassed Timeout
    {% else %}
        M118 Timeout Reached
        M117 Timeout Reached
        TURN_OFF_HEATERS
        M84
    {% endif %}

# CoreXY: home X then Y, then move to center and home Z
[homing_override]
axes: xyz
set_position_z: 0
gcode:
  {% set REQX = 'X' in params or 'x' in params %}
  {% set REQY = 'Y' in params or 'y' in params %}
  {% set REQZ = 'Z' in params or 'z' in params %}
  {% if not REQX and not REQY and not REQZ %}
    {% set REQX = True %}{% set REQY = True %}{% set REQZ = True %}
  {% endif %}
  # Center for 235mm build; use 185 for 370mm
  {% set CENTER_X = 117.5 %}
  {% set CENTER_Y = 117.5 %}
  {% set XY_FEED = 120 * 60 %}
  {% set Z_HOP = 6 %}
  {% set Z_HOP_F = 8 * 60 %}

  SAVE_GCODE_STATE NAME=homing_state
  {% if 'z' not in printer.toolhead.homed_axes %}
    G91
    G0 Z{Z_HOP} F{Z_HOP_F}
    G90
  {% endif %}

  {% if REQY %} G28 Y {% endif %}
  {% if REQX %} G28 X {% endif %}

  {% if REQZ %}
    {% if not REQY and 'y' not in printer.toolhead.homed_axes %} G28 Y {% endif %}
    {% if not REQX and 'x' not in printer.toolhead.homed_axes %} G28 X {% endif %}
    G0 X{CENTER_X} Y{CENTER_Y} F{XY_FEED}
    G28 Z
    G91
    G0 Z{Z_HOP} F{Z_HOP_F}
    G90
  {% endif %}
  RESTORE_GCODE_STATE NAME=homing_state MOVE=0

[verify_heater extruder]
max_error: 120
check_gain_time: 30
hysteresis: 5
heating_gain: 1

[verify_heater heater_bed]
max_error: 120
check_gain_time: 300
hysteresis: 5
heating_gain: 1

[controller_fan controller_fan]
pin: PB5
fan_speed: 1
idle_speed: 0
idle_timeout: 30

[heater_fan extruder_fan]
pin: nozzle_mcu:PB9

[fan]
pin: nozzle_mcu:PB6
cycle_time: 0.005
hardware_pwm: True

[force_move]
enable_force_move: True

[gcode_arcs]
resolution: 1.0

[exclude_object]

[stepper_enable]

######################################################################
# Mercury-specific macros (park, wipe, cut, purge) — adjust coordinates
# for your build size (235 vs 370) and toolhead layout.
######################################################################

[gcode_macro TO_THROW_POSITION]
description: Move to park/throw position for filament change or cut
gcode:
  {% set speed = params.SPEED|default(12000)|float %}
  G90
  G1 F{speed}
  G1 X10 Y10

[gcode_macro MOVE_HEAT_POS]
description: Move to position for heating (e.g. before wipe)
gcode:
  G90
  G1 X117.5 Y117.5 F7200

[gcode_macro NOZZLE_WIPE_SEQUENCE]
description: Wipe nozzle before print
gcode:
  SAVE_GCODE_STATE NAME=merc_wipe_state
  G90
  G1 Z5 F600
  G1 X50 Y50 F7200
  G1 Z0.3 F300
  G1 X80 F3000
  G1 Y55 F3000
  G1 X50 F3000
  G1 Y50 F3000
  G1 Z5 F600
  RESTORE_GCODE_STATE NAME=merc_wipe_state MOVE=1 MOVE_SPEED=200

[gcode_macro RESUME_NOZZLE_WIPE_SEQUENCE]
gcode:
  TO_THROW_POSITION
  NOZZLE_WIPE_SEQUENCE

[gcode_macro CUT_TIP]
description: Cut filament tip (adjust coordinates if you have a physical cutter)
gcode:
  { action_respond_info("MERC: CUT_TIP (no physical cutter — retract only)") }
  G91
  G1 Z4 F4800
  G90
  M400
  FORCE_MOVE STEPPER=extruder DISTANCE=-2 VELOCITY=10
  FORCE_MOVE STEPPER=extruder DISTANCE=2 VELOCITY=10
  FORCE_MOVE STEPPER=extruder DISTANCE=-2 VELOCITY=10
  TO_THROW_POSITION
  FORCE_MOVE STEPPER=extruder DISTANCE=2 VELOCITY=10

[gcode_macro UNDERLINE]
description: Purge line at start of print
gcode:
  M83
  G90
  G92 E0
  G0 X15 Y15 F7200
  G1 Z0.30 F1200
  G1 X100 E6 F1200
  G1 Y20 E0.6 F1200
  G1 X15 E6 F1200
  G92 E0
  M82

[gcode_macro FLUSH_POOP]
description: Flush/purge after insert
gcode:
  TO_THROW_POSITION
  G4 P500
  TO_THROW_POSITION
  M106 S255
  G4 P1000
  SHAKE_NOZZLE_HORIZONTAL
  TO_THROW_POSITION
  M106 S0

[gcode_macro SHAKE_NOZZLE_HORIZONTAL]
description: Shake nozzle to remove purged filament
gcode:
  {% set AMP = params.AMP|default(20)|float %}
  {% set COUNT = params.COUNT|default(2)|int %}
  {% set SPEED = params.SPEED|default(20000)|float %}
  {% set AMP_NEG = 0 - AMP %}
  SAVE_GCODE_STATE NAME=shake_nozzle_state
  G91
  {% for i in range(COUNT) %}
    G1 X{AMP} F{SPEED}
    G1 X{AMP_NEG} F{SPEED}
  {% endfor %}
  G90
  RESTORE_GCODE_STATE NAME=shake_nozzle_state

[gcode_macro ZHOP_MIN]
description: Min z-hop (works when Z is unhomed)
gcode:
  {% set zh = params.Z|default(1.0)|float %}
  {% if "z" in printer.toolhead.homed_axes %}
    G91
    G1 Z{zh} F300
    G90
  {% else %}
    RESPOND PREFIX="warning" MSG="Z not homed, using FORCE_MOVE for z-hop"
    FORCE_MOVE STEPPER=stepper_z DISTANCE={zh} VELOCITY=5 ACCEL=50
  {% endif %}
  M400

[gcode_macro CANCEL_PRINT]
description: Cancel print
rename_existing: CANCEL_PRINT_BASE
gcode:
  RESPOND TYPE=command MSG=action:prompt_end
  { action_respond_info("MERC: CANCEL_PRINT, lifting Z") }
  G91
  G1 Z3 F600
  G90
  {% if printer["output_pin ACE_Pro"] is defined and printer["output_pin ACE_Pro"].value %}
    _ACE_HANDLE_PRINT_END
  {% else %}
    CUT_TIP
    FORCE_MOVE STEPPER=extruder DISTANCE=-90 VELOCITY=10
  {% endif %}
  TO_THROW_POSITION
  M104 S0
  M140 S0
  M106 S0
  M84
  CANCEL_PRINT_BASE

[gcode_macro PRINT_END]
description: Print end (cut optional)
gcode:
  {% set _cut_raw = (params.CUT_TIP|default(params.cut_tip)|default("1"))|string %}
  {% set _cut_raw = (_cut_raw|trim|replace('=', '', 1)|lower) %}
  {% set do_cut = (1 if _cut_raw in ['1','true','yes','on'] else 0) %}
  { action_respond_info("PRINT_END, lifting z") }
  G91
  G1 Z3 F600
  G90
  {% if printer["output_pin ACE_Pro"] is defined and printer["output_pin ACE_Pro"].value %}
    _ACE_HANDLE_PRINT_END CUT_TIP={do_cut}
  {% endif %}
  {% if not (printer["output_pin ACE_Pro"] is defined and printer["output_pin ACE_Pro"].value) %}
    {% if do_cut %}
      CUT_TIP
      TO_THROW_POSITION
      G1 E-100 F600
    {% else %}
      TO_THROW_POSITION
    {% endif %}
  {% else %}
    TO_THROW_POSITION
  {% endif %}

# G9111 — Startup macro (Anycubic slicer / ACE compatible)
[gcode_macro G9111]
description: "Startup: BEDTEMP= EXTRUDERTEMP= [WIPETEMP=] [TOOL=]"
variable_wipe_temp: 150
variable_travel_speed: 200
gcode:
  {% set bed_raw = (params.BEDTEMP|default(params.S)|default("60"))|string %}
  {% set noz_raw = (params.EXTRUDERTEMP|default(params.T)|default("200"))|string %}
  {% set BEDTEMP = (bed_raw|replace('=', '', 1))|float %}
  {% set EXTRUDERTEMP = (noz_raw|replace('=', '', 1))|float %}
  {% set calculated_wipe = [(EXTRUDERTEMP * 0.75), 150]|max %}
  {% set WIPETEMP = params.WIPETEMP|default(calculated_wipe)|float %}
  {% set TOOL = ((params.TOOL|default(params.tool)|default(params.T)|default(params.t)|default("-1"))|string|replace('=', '', 1)|int) %}

  {% set local_skip_purge = False %}
  {% if printer.save_variables is defined and printer.save_variables.variables is defined %}
    {% set ace_index = printer.save_variables.variables.ace_current_index|default(-1)|int %}
    {% set filament_pos = printer.save_variables.variables.ace_filament_pos|default('none') %}
  {% else %}
    {% set ace_index = -1 %}
    {% set filament_pos = 'none' %}
  {% endif %}
  {% set is_physically_loaded = False %}
  {% if "filament_switch_sensor filament_runout_nozzle" in printer.configfile.settings %}
    {% set is_physically_loaded = printer["filament_switch_sensor filament_runout_nozzle"].filament_detected %}
  {% endif %}
  {% if TOOL == ace_index and filament_pos == 'nozzle' and is_physically_loaded %}
    {% set local_skip_purge = True %}
    { action_respond_info("G9111: Tool %d already loaded. Purge SKIPPED." % TOOL) }
  {% endif %}

  {% if printer["gcode_macro _ACE_STATE"] is defined %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=startup_toolchange VALUE=1
  {% endif %}

  M140 S{BEDTEMP}
  M104 S{WIPETEMP}
  G28
  {% if TOOL >= 0 %}
    TO_THROW_POSITION
    M109 S{EXTRUDERTEMP}
    T{TOOL}
    M400
    MOVE_HEAT_POS
    M106 S255
    M109 S{WIPETEMP}
    M106 S0
  {% else %}
    {% set current_extruder = printer.toolhead.extruder %}
    {% set tool_num = current_extruder|replace('extruder','') %}
    {% set tool_num = tool_num if tool_num|length > 0 else '0' %}
    T{tool_num}
    M400
  {% endif %}

  TO_THROW_POSITION
  NOZZLE_WIPE_SEQUENCE
  G28 Z
  M190 S{BEDTEMP}
  BED_MESH_CALIBRATE PROFILE=adaptive ADAPTIVE=1
  M106 S0
  MOVE_HEAT_POS
  M109 S{EXTRUDERTEMP}
  TO_THROW_POSITION

  M83
  {% if not local_skip_purge %}
    G1 E50 F400
    G1 E60 F150
    G4 P3000
    TO_THROW_POSITION
    G1 E90 F150
    G4 P3000
    G92 E0
    G1 E-2 F1800
  {% else %}
    G1 E2 F300
  {% endif %}

  {% if printer["gcode_macro _ACE_STATE"] is defined %}
    SET_GCODE_VARIABLE MACRO=_ACE_STATE VARIABLE=startup_toolchange VALUE=0
  {% endif %}
  M400
  UNDERLINE
  CLEAR_PAUSE
  SET_IDLE_TIMEOUT TIMEOUT=3600
  RESPOND TYPE=echo MSG="G9111 complete."

[display_status]
